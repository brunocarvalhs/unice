name: Web

# Publishes the privacy policy and marketing landing page (docs/privacy.html, docs/landing.html, docs/store/) to
# GitHub Pages — that's the public URL Play Console wants for the privacy policy. Called by release.yml (after
# tests, in parallel with the Android build); can also be run alone from the Actions tab.
# Needs Settings > Pages > Source = "GitHub Actions" once.
#
# The WebGL game build is OFF (targets.web.webgl: false in .github/build-targets.yml) — it only slows the pipeline
# down right now and isn't needed to ship the landing page/privacy policy. When targets.web.webgl is turned back
# on, this workflow also builds the game and serves it at the Pages root, with the landing page/privacy policy
# riding along next to it at /landing.html and /privacy.html.
"on":
  workflow_call:
    inputs:
      webgl:
        description: "Also build the WebGL game and publish it alongside the landing page"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      webgl:
        description: "Also build the WebGL game and publish it alongside the landing page"
        required: false
        type: boolean
        default: false

# One Pages deploy at a time; a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Free disk space
        if: inputs.webgl
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        if: inputs.webgl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Library
            Temp
            obj
          key: unity-webgl-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-webgl-${{ runner.os }}-

      - name: Build WebGL
        if: inputs.webgl
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.6.3f1
          targetPlatform: WebGL
          buildName: Unice
          buildsPath: build/Web
          versioning: Semantic
          allowDirtyBuild: true

      - name: Prepare Pages site (landing page only)
        if: ${{ !inputs.webgl }}
        shell: bash
        run: |
          mkdir -p build/Web/WebGL/Unice
          cp docs/landing.html build/Web/WebGL/Unice/index.html

      - name: Add privacy policy and landing page
        shell: bash
        run: |
          # game-ci/unity-builder builds as root inside Docker, so the whole output tree
          # (including the WebGL parent dir, not just Unice/) is root-owned; hand it back to
          # the runner user before writing into it. Harmless when it was just created above
          # as this same user.
          sudo chown -R "$(id -u):$(id -g)" build/Web/WebGL
          if [ "${{ inputs.webgl }}" = "true" ]; then
            mkdir -p build/Web/WebGL/Unice_root/play
            find build/Web/WebGL/Unice -mindepth 1 -maxdepth 1 -not -name play -exec mv {} build/Web/WebGL/Unice_root/play/ \;
            cp docs/landing.html build/Web/WebGL/Unice_root/index.html
            sed -i 's|href="./"|href="play/"|g' build/Web/WebGL/Unice_root/index.html
            rm -rf build/Web/WebGL/Unice
            mv build/Web/WebGL/Unice_root build/Web/WebGL/Unice
          fi
          cp docs/privacy.html docs/landing.html build/Web/WebGL/Unice/
          cp -r docs/store build/Web/WebGL/Unice/store

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/Web/WebGL/Unice

  publish-webgl:
    name: Publish to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
