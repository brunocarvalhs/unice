name: Version

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  bump-version:
    name: Create version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Bump by Conventional Commits since the last tag + CHANGELOG.md entry (.github/scripts/version.sh).
      # Prints nothing when there's nothing releasable (only docs/ci/chore/... commits).
      - name: Determine next version
        id: version
        run: |
          chmod +x .github/scripts/version.sh
          echo "version=$(.github/scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Commit CHANGELOG and push tag
        if: steps.version.outputs.version != ''
        run: |
          set -e
          tag="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md ProjectSettings/ProjectSettings.asset
          git commit -m "chore(release): $tag [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "$tag"
          git push origin "$tag"
