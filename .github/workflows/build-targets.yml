name: Build targets

# Reads .github/build-targets.yml. Called by debug.yml and release.yml so both build only the enabled targets.
"on":
  workflow_call:
    outputs:
      android:
        description: "'true' when targets.mobile.android is enabled"
        value: ${{ jobs.resolve.outputs.android }}
      webgl:
        description: "'true' when targets.web.webgl is enabled"
        value: ${{ jobs.resolve.outputs.webgl }}
      platforms:
        description: "JSON list of {name, target} for the enabled iOS and desktop targets ('[]' when none), for a build matrix"
        value: ${{ jobs.resolve.outputs.platforms }}

jobs:
  resolve:
    name: Resolve build targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      android: ${{ steps.targets.outputs.android }}
      webgl: ${{ steps.targets.outputs.webgl }}
      platforms: ${{ steps.targets.outputs.platforms }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/build-targets.yml
          sparse-checkout-cone-mode: false

      - name: Resolve targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          file=.github/build-targets.yml
          # Targets that have build/publish jobs in this pipeline. Targets are grouped (mobile, desktop, console),
          # so look at every true leaf whatever its group.
          supported='["android", "webgl", "ios", "windows", "macos", "linux"]'
          unsupported=$(yq -o=tsv "[.targets | .. | select(tag == \"!!bool\" and . == true) | path | .[-1]] - $supported | join(\" \")" "$file")
          if [ -n "$unsupported" ]; then
            echo "::error file=$file::enabled targets with no pipeline jobs yet: $unsupported"
            exit 1
          fi
          echo "android=$(yq '.targets.mobile.android' "$file")" >> "$GITHUB_OUTPUT"
          echo "webgl=$(yq '.targets.web.webgl // false' "$file")" >> "$GITHUB_OUTPUT"

          # iOS and desktop share one reusable build workflow, so they go out as a matrix: name -> Unity build target
          platforms='[]'
          add_platform() {
            local enabled
            enabled=$(yq "[.targets[] | .$1] | map(select(. == true)) | length" "$file")
            if [ "$enabled" -gt 0 ]; then platforms=$(jq -c --arg name "$1" --arg target "$2" '. + [{name: $name, target: $target}]' <<< "$platforms"); fi
          }
          add_platform windows StandaloneWindows64
          add_platform macos StandaloneOSX
          add_platform linux StandaloneLinux64
          add_platform ios iOS
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
