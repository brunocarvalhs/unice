name: Build platform

# One Unity build for iOS or a desktop OS, uploaded as an artifact. Called once per enabled target by debug.yml and
# release.yml (a matrix over the "platforms" output of build-targets.yml). Android and WebGL have their own jobs.
# Windows, macOS and Linux build on a Linux runner (Mono); iOS exports an Xcode project that is signed and published by hand.
"on":
  workflow_call:
    inputs:
      name:
        description: "windows, macos, linux or ios (artifact name)"
        required: true
        type: string
      target:
        description: "Unity build target: StandaloneWindows64, StandaloneOSX, StandaloneLinux64 or iOS"
        required: true
        type: string
      release:
        description: "true for a release build (semantic version), false for a debug build"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FLAVOR: ${{ inputs.release && 'Release' || 'Debug' }}

    steps:
      # The Unity images are large and the hosted runner runs out of disk pulling them.
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      # Unity sometimes dies with exit code 137 (SIGKILL) right after starting; swap guards against the runner running out of memory.
      - name: Add swap
        shell: bash
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Library
            Temp
            obj
          key: unity-${{ env.FLAVOR }}-${{ inputs.target }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-${{ env.FLAVOR }}-${{ inputs.target }}-

      - name: Build ${{ inputs.target }}
        id: build
        continue-on-error: true   # a killed Unity (exit 137) gets one more try below
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.6.3f1
          targetPlatform: ${{ inputs.target }}
          buildName: Unice
          buildsPath: build/${{ env.FLAVOR }}
          versioning: ${{ inputs.release && 'Semantic' || 'None' }}
          allowDirtyBuild: true

      # Tells whether the kernel killed Unity for lack of memory (look for "Out of memory" / "Killed process").
      - name: Why the first build failed
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          free -h
          df -h /
          sudo dmesg | grep -iE "out of memory|killed process|oom" | tail -n 10 || true

      - name: Build ${{ inputs.target }} (second try)
        if: steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.6.3f1
          targetPlatform: ${{ inputs.target }}
          buildName: Unice
          buildsPath: build/${{ env.FLAVOR }}
          versioning: ${{ inputs.release && 'Semantic' || 'None' }}
          allowDirtyBuild: true

      # A zip drops the executable bit, which the macOS app and the Linux player need: pack those two as tar.gz.
      - name: Pack with permissions
        if: inputs.name == 'macos' || inputs.name == 'linux'
        shell: bash
        run: tar -czf "Unice-${{ inputs.name }}.tar.gz" -C "build/${{ env.FLAVOR }}/${{ inputs.target }}" .

      - name: Upload packed build
        if: inputs.name == 'macos' || inputs.name == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Unice-${{ env.FLAVOR }}-${{ inputs.name }}
          path: Unice-${{ inputs.name }}.tar.gz
          if-no-files-found: error

      - name: Upload build
        if: inputs.name == 'windows' || inputs.name == 'ios'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Unice-${{ env.FLAVOR }}-${{ inputs.name }}
          path: build/${{ env.FLAVOR }}/${{ inputs.target }}
          if-no-files-found: error
