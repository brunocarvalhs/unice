# Build targets for the CI/CD pipeline (debug.yml and release.yml).
# true = built on every run and, on master, published to its store (Android) or kept as a build artifact (the others).
# iOS is exported as an Xcode project: signing and TestFlight/App Store need an Apple Developer account and stay manual.
targets:
  mobile:
    android: true
    ios: true
  desktop:
    windows: true
    macos: true
    linux: true
  web:
    webgl: false  # game build off for now; the landing page/privacy policy still publish to GitHub Pages regardless (release.yml)
  console:
    playstation: false
    xbox: false
    nintendo-switch: false
